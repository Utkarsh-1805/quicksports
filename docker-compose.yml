services:
  postgres:
    image: postgres:16-alpine
    container_name: quickcourt-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quickcourt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quickcourt}
      POSTGRES_DB: ${POSTGRES_DB:-quickcourt}
    ports:
      - "5432:5432"
    volumes:
      - quickcourt-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-quickcourt} -d $${POSTGRES_DB:-quickcourt}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quickcourt-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-quickcourt}:${POSTGRES_PASSWORD:-quickcourt}@postgres:5432/${POSTGRES_DB:-quickcourt}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      # Razorpay
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      # SMTP
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      EMAIL_FROM: ${EMAIL_FROM}
      # Cloudinary (optional — falls back to local disk)
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
    ports:
      - "3000:3000"
    # Run pending migrations against the freshly-started DB, then start the app
    command: sh -c "npx prisma db push --skip-generate && npm start"

volumes:
  quickcourt-pgdata:
