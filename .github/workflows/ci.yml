name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint
        continue-on-error: true # 35 pre-existing img/exhaustive-deps warnings are tracked, not blocking

      - name: Unit tests (Vitest)
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Build-only placeholders so next build doesn't fail on `new URL`
          # constructors in metadataBase. Real values come from the deploy env.
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          JWT_SECRET: ci_build_only_secret
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
